      - shared activity room with several unevenly spaced tables, stacked plain board-game boxes at the edge, and mixed ceiling fixtures
      - cafeteria-like day space with fixed stools, long tables, acoustic wall panels, and natural wear along main walking paths
      - renovated communal room where new chairs mix with older tables, window blinds sit at different heights, and corners remain shadowed
