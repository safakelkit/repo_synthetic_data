      - shared wash area with offset basins, privacy partition edges, damp floor variation, and a broad dry grooming shelf
      - small bathroom alcove with a steel sink, painted blockwork, ventilation grille, water marks, and an unobstructed side table
      - institutional vanity corner with a long composite counter, mismatched taps, aged tile repairs, and darker recesses beyond
