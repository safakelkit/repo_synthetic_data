  support_profiles:
    - a worn matte laminate tabletop crosses the lower third, with its front edge visible
    - a scratched timber-look desk occupies the lower foreground, showing grain and rounded edge wear
    - a dull painted-steel workbench fills the near foreground, with small chips but an unobstructed center
    - a compact composite counter enters from one side in convincing perspective, leaving a broad clear area
    - a waist-high institutional sorting table sits close to camera, with a visible edge and realistic surface abrasion
    - a fixed wall ledge spans the lower middle of frame, dry and clear enough for object placement
    - a mismatched side table is nearest the camera, slightly off-center with a plainly visible horizontal top
    - a broad utilitarian counter anchors the foreground, its corners and thickness clearly defined
  composition_profiles:
    - eye-level doorway composition with an off-center vanishing point and layered depth
    - chest-height three-quarter view with the support plane covering roughly the lower quarter
    - slightly elevated oblique view showing both the support surface and room beyond
    - close environmental view with the clear surface prominent but not isolated like a product table
    - wide corner view with partial doorframe occlusion and natural architectural convergence
    - ordinary standing-height view with asymmetric furniture spacing and breathing room around the support
    - restrained handheld framing with one cropped fixed fixture at the edge and no dramatic angle
    - medium-wide inspection view with foreground, middle ground, and background all legible
  capture_profiles:
    - older 28 mm smartphone, slight barrel distortion and restrained sensor noise
    - 35 mm phone camera, modest dynamic range and neutral auto white balance
    - handheld 30 mm camera, tiny tilt and fine noise in shadows
    - 26 mm mobile lens, mild corner softness and realistic highlight roll-off
    - 32 mm documentary camera, deep focus and no artificial bokeh
    - practical phone snapshot, slight exposure inconsistency and soft extreme corners
    - inspection camera, natural vertical convergence and unpolished framing
    - contemporary mobile camera, restrained sharpening and realistic indoor color
  lighting_profiles:
    - overcast side-window daylight with weak ceiling fill and gentle shadow gradients
    - aging fluorescent tubes with uneven brightness, slightly green highlights, and darker corners
    - mixed cool window light and warmer corridor spill through the doorway
    - low winter daylight from a high window with practical ceiling fixtures switched on
    - late-afternoon side light softened by blinds, with believable exposure variation
    - flat cloudy daylight, muted colors, and no dramatic cinematic shadows
    - warm older ceiling lamps mixed with cool service-area light in the distance
    - bright but non-studio ambient light with localized falloff beneath shelves and furniture
  material_profiles:
    - blockwork, laminate, steel, sealant and flooring retain distinct roughness
    - old and new repairs differ subtly in hue, sheen and edge wear
    - porous masonry, brushed metal, molded plastic and wood remain distinct
    - reflections are subdued and uneven, with credible fixture contact shadows
    - floor seams, wall texture and furniture edges show realistic construction
    - mixed material ages create restrained variation without decorative styling
    - touched edges are smoother while recesses retain dust and dull paint
    - utilitarian finishes show abrasion, patching and maintenance, not decay
  use_trace_profiles:
    - wiped central surfaces contrast with dust along walls and rear corners
    - walking-path scuffs and furniture-leg marks appear in plausible places
    - folded neutral textiles or plain folders stay peripheral, leaving center clear
    - irregular chairs and partly open storage suggest temporary vacancy
    - water marks, paint touch-ups and aged sealant occur plausibly
    - uneven fading and isolated scratches suggest repeated daily use
    - cleaned areas contrast with older wear around hinges and skirting
    - slight far-edge clutter adds occupancy while the foreground stays usable
foreground_generation:
  prompt_template: >-
    Studio product photograph of exactly {target}. One isolated centered object,
    fully visible, realistic, sharp boundary, plain light-gray seamless backdrop,
    no furniture or hand. {variation}.
  negative_prompt: >-
    multiple objects, duplicate, wrong object, extra tool, cropped, truncated,
    occluded, deformed, fused parts, floating fragments, person, hand, room,
    table, shelf, complex background, patterned background, readable text,
    logo, watermark, illustration, cartoon, CGI, blur
  class_prompts:
    0: one disposable pocket lighter with ignition wheel and metal top
    1: one open cardboard matchbox containing wooden safety matches with visible match heads
    2: one pair of household scissors with two finger handles and two metal blades
    3: one pair of combination pliers with two handles, gripping jaws and central pivot
    4: one handheld knife with a single metal blade and handle
    5: one disposable T-shaped manual razor with broad razor head and short handle
    6: one claw hammer with metal head and wooden handle
    7: one cigarette pack with several tobacco cigarettes visible at the open top
    8: one handheld hacksaw with rigid frame, handle and toothed blade
    9: one manual screwdriver with handle and long metal shaft
    10: one metal wrench with a clearly visible jaw or ring end
    11: one upright deodorant aerosol spray can with cylindrical metal body, rounded cap, push-button nozzle and flat base
    12: one rectangular 9-volt battery with two snap terminals on top
    13: one small glass bottle of alcoholic drink with neck and cap
    14: one modern rectangular smartphone with glass screen, bezel and camera
    15: one open laptop with hinged screen, keyboard and trackpad
  variation_phrases:
    - front three-quarter view, common consumer design, neutral color
    - opposite three-quarter view, visibly different product design and color
    - slightly elevated camera view, lightly used realistic surface finish
    - near-frontal view, inexpensive everyday construction and distinct proportions
    - shallow side angle, alternate material finish and restrained wear
    - elevated oblique view, different brandless design with no readable markings
    - low three-quarter view, darker colorway and realistic edge wear
    - centered catalog view, lighter colorway and a distinct silhouette variant
  retry_guidance:
    2: two loops, two blades, one pivot; no shears
    7: closed pack only; no loose cigarettes or pile
    8: complete manual bow frame and blade; no motor
    12: PP3 form; no cable, holder or loose cells
    14: single slab phone; no stack or folding device
  controlled_retry:
    class_ids: [2, 7, 8, 12]
    candidates_per_class: 2
    controlnet_conditioning_scale: 0.95
    prompt_template: >-
      Realistic studio product photo of exactly {target}. One complete isolated
      object matching the supplied geometry, centered on a plain light-gray
      background, natural material and minor wear, no hand. {guidance}.
    negative_prompt: >-
      multiple objects, duplicate, extra parts, disconnected parts, wrong
      object, malformed, cropped, hand, person, furniture, clutter, text, logo,
      watermark, cartoon, illustration, CGI, blur

segmentation:
