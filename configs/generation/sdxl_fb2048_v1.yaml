background_generation:
  guidance_scales: [4.2, 4.6, 5.0]
  negative_prompt: >-
    person, hand, lighter, matches,
    scissors, pliers, knife, razor, hammer, cigarettes, saw, screwdriver,
    wrench, aerosol can, battery, alcohol bottle, phone, laptop, text, logo,
    watermark, floating object
  negative_prompt_2: >-
    artificial render, synthetic surfaces, plastic texture, excessive HDR,
    cinematic color grading, dramatic studio lighting, pristine showroom,
    catalog interior, hotel room, luxury furniture, perfect symmetry,
    repeated furniture, warped architecture, oversharpening, depth-of-field blur
  prompt_template: >-
    Candid correctional inspection photo. {scene_recipe}. {support}.
    {composition}.
  prompt_2_template: >-
    Unstaged mobile documentary photo. {capture}. {lighting}. {materials}.
    {use_trace}.
