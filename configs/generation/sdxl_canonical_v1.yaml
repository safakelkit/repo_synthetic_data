format_version: 1
pipeline_id: sdxl_full_scene_canonical_v1
status: ready_for_canonical_acceptance_test
backend: sdxl
models_config: configs/generation/genai_models_v1.yaml
scene_policy: configs/generation/genai_scene_policy_v1.yaml
generation_policy: configs/generation/genai_generation_policy_v1.yaml
degradation_policy: configs/generation/genai_degradation_v1.yaml
output_roots:
  test: data/synthetic/canonical_tests/sdxl_full_scene_v1
  production: data/synthetic/sdxl_full_scene_v1/candidates
seed: 42000
output_size: [1024, 1024]
inference_steps: 30
guidance_scale: 5.0

test:
  images_per_class_scene: 1
  expected_candidates: 64
  training_use_forbidden: true

production:
  approved: false
  accepted_images_per_class: 128
  accepted_per_class_scene_block: 8
  class_scene_blocks: 4
  standard_attempts_per_class_scene_block: 10
  class_attempts_per_class_scene_block:
    11: 12
  expected_candidates: 2592
  accepted_dataset_size: 2048
  nested_prefixes: [512, 1024, 1536, 2048]

acceptance:
  policy: compact_annotation_first_v1
  accept_if:
    - requested_class_is_human_recognizable
    - all_project_class_instances_can_be_reliably_boxed
    - image_and_annotations_are_technically_valid
  reject_if:
    - requested_class_absent_or_clearly_wrong
    - target_unrecognizably_malformed
    - reliable_bounding_box_cannot_be_created
    - visible_project_class_instance_would_remain_unlabelled
  not_automatic_rejection:
    - mild_synthetic_appearance
    - simple_scene
    - imperfect_centering
    - minor_perspective_or_surface_artifact
    - multiple_same_class_instances_if_all_are_annotated

silhouette_source:
  audit_manifest: data/processed/object_bank_sam3/asset_audit_manifest.csv
  use_rgb_or_rgba_pixels: false
  selection_seed_offset: 1000
