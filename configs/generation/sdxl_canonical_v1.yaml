control_layout:
  canvas_value: 32
  support_value: 128
  target_value: 235
  semantic_edge_value: 32
  pre_canny_blur_sigma: 1.0
  canny_thresholds: [80, 160]
  support_jitter_px: 28
  target_center_jitter_px: [70, 45]
  target_scale_factor: [0.72, 0.96]

prompt_variation:
  lighting: [neutral mixed lighting, dim institutional lighting, cool fluorescent lighting, uneven indoor lighting]
  camera: [eye-level inspection view, slightly elevated inspection view, oblique mobile-camera view, close documentary inspection view]
  material: [plain institutional surfaces, worn painted surfaces, metal and laminate furnishings, sparse concrete and metal interior]
  clutter: [minimal background clutter, a few ordinary non-target belongings, sparse utilitarian furnishing, restrained inspection-room clutter]

prompt:
  prefix: A realistic mobile inspection-camera photograph inside a correctional facility.
  suffix: >-
    Exactly {target} is clearly recognizable on a physically plausible support
    surface, fully inside the image and suitable for a reliable bounding box.
    Natural perspective, realistic materials, documentary photography, no
    people, no readable text.
  negative: >-
    wrong primary object, unrecognizable target, severely deformed target,
    cropped primary target, hidden primary target, hand, person, readable text,
    logo, watermark, illustration, cartoon, CGI

release_gate:
  canonical_test_approved: true
  production_approved: false
  production_requires:
    - canonical_test_visual_review
    - annotation_pipeline_preflight
    - finalizer_preflight
