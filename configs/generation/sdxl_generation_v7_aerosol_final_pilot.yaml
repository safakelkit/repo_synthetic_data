format_version: 7
base_config: configs/generation/sdxl_generation_v3.yaml
pipeline_id: sdxl_generation_v7_aerosol_final_pilot
status: ready_for_acceptance_test
output_root: data/synthetic/sdxl_generation_v7_aerosol_final_pilot/acceptance_test
seed: 59000

# Final four-image aerosol validation, invoked with --class-id 11.  It uses
# the same full-scene SDXL+Canny route as the successful classes.  Only the
# accepted binary mask and simple class-defining edges condition the model;
# source RGB/RGBA is never composited or passed to the generator.
generation_modes:
  class_overrides: {11: silhouette_canny}

controlnet_conditioning_scale:
  class_overrides: {11: 0.80}

silhouette_source:
  preferred_stems:
    11:
      - IMG_0428new_obj_00_crop_000116
      - IMG_0495new_obj_01_crop_000136
      - IMG_20240807_095809160_obj_00_crop_000206
      - IMG_20240807_100444835_obj_00_crop_000227

class_rotation_degrees: {11: [0]}
control_layout:
  target_scale_factor: [0.88, 0.96]
  target_center_jitter_px: [16, 12]

scene_layouts:
  cell_storage_area: {target_box_xyxy: [395, 350, 640, 780]}
  cell_wash_area: {target_box_xyxy: [405, 490, 650, 900]}
  property_inspection_station: {target_box_xyxy: [390, 420, 640, 850]}
  maintenance_service_area: {target_box_xyxy: [390, 380, 640, 800]}

# Cap seam and small centered actuator distinguish a can from a bottle, pipe,
# fixture, or wall light while leaving SDXL to synthesize the object texture.
semantic_control_overlays:
  11:
    thickness_ratio: 0.016
    rectangles: [[[0.18, 0.04], [0.82, 0.20]]]
    lines: [[[0.18, 0.22], [0.82, 0.22]]]
    circles: [[[0.50, 0.115], 0.035]]

class_target_phrases:
  11: [one upright aerosol can with a cylindrical aluminum body, cap, and press nozzle]
class_negative_additions:
  11:
    - bottle
    - pump
    - trigger sprayer
    - wall light
    - pipe
    - faucet
    - machine
    - duplicate can
    - visible spray cloud
    - paint splatter
