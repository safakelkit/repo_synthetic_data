format_version: 3
feasibility_id: genai_full_scene_real_silhouette_single_image_v3
status: ready_for_manual_gpu_launch
models_config: configs/generation/genai_models_v1.yaml
scene_policy: configs/generation/genai_scene_policy_v1.yaml
backends: [sdxl, qwen]
samples_per_backend: 1
same_control_for_both_backends: true
apply_canonical_degradation: false
output_root: data/synthetic/feasibility/full_scene_v3
silhouette_source:
  type: real_class_sam3_binary_mask
  audit_manifest: data/processed/object_bank_sam3/asset_audit_manifest.csv
  selection_seed: 42
  use_rgb_pixels: false
  use_rgba_pixels: false
  apply_to_all_classes: true
  geometry_critical_classes_without_programmatic_fallback:
    - Lighter
    - Matches
    - Scissors
    - Pliers
    - Knife
    - Hammer
    - Saw
    - Screwdriver
    - Wrench
    - Aerosol can
    - Alcohol
control_layout:
  representation: canny_from_real_class_sam3_binary_silhouette
  canvas_value: 32
  table_value: 128
  object_value: 235
  pre_canny_blur_sigma: 1.0
  canny_thresholds: [80, 160]
  table_polygon:
    - [130, 440]
    - [894, 440]
    - [1010, 1010]
    - [14, 1010]
  target_box_xyxy: [345, 520, 679, 830]
  notes:
    - Only the binary shape of an accepted class-matched SAM3 mask is reused.
    - No RGB or RGBA pixels from INSP-DET enter the control or generated image.
    - SDXL and Qwen receive the identical mask-derived Canny condition.
    - Canonical generation will select silhouettes deterministically and distribute asset reuse.
output_files:
  generated_image: generated.png
  control_image: control_canny.png
  proxy_layout: proxy_layout.png
  run_record: run_record.json
  resolved_config: resolved_config.yaml
