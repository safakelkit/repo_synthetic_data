base_config: configs/generation/copy_paste_v1.yaml
version: sdxl_hybrid_initialization_512_v1
method: source_initialized_sdxl_hybrid
seed: 92000

production:
  output_root: data/synthetic/sdxl_hybrid_512_v1/initializations
  num_images: 512
  images_per_class: 32
  nested_prefixes: [512]
  save_compositing_masks: true
  create_subset_manifests: false

allocation:
  object_asset_sampling_unit: source_image
  background_sampling: balanced_low_reuse
  lying_rotation_degrees: [-25, -15, -8, 0, 8, 15, 25, 180]

degradation:
  status: frozen_implemented
  apply_to_complete_composite: false
  seed_offset: 2
  operations: []
  severity_distribution: {clean: 1.0}
  per_class_per_32_images: {clean: 32, light: 0, medium: 0, heavy: 0}
  levels: {}
  composition_rule: clean_only_before_sdxl_harmonization
  tuning_restriction: do_not_modify_using_easy_or_hard_test_results

quality_control:
  status: frozen_implemented
  generation_attempts_per_image: 100

release_gate:
  approved: true
  require_clean_git_worktree: true
  blockers: []

harmonization:
  output_root: data/synthetic/sdxl_hybrid_512_v1
  model_config: configs/generation/genai_models_v1.yaml
  output_size: [1024, 1024]
  inference_steps: 30
  guidance_scale: 5.0
  default_strength: 0.40
  default_canny_scale: 0.88
  mask_padding_px: 20
  seed_offset: 1000
  strength_by_class:
    1: 0.25
    3: 0.28
    5: 0.22
    8: 0.25
    11: 0.72
    12: 0.15
    14: 0.12
    15: 0.18
  canny_scale_by_class:
    1: 1.0
    3: 1.0
    5: 1.0
    8: 1.0
    11: 0.92
    12: 1.0
    14: 1.0
    15: 1.0
  class_prompts:
    0: one disposable pocket lighter with ignition wheel and metal top
    1: one safety matchbox or group of wooden safety matches matching the supplied object
    2: one pair of household scissors with two finger handles and metal blades
    3: one pair of combination pliers with two handles, gripping jaws and pivot
    4: one handheld knife with a single metal blade and handle
    5: one manual T-shaped razor with broad razor head and short handle
    6: one claw hammer with metal head and handle
    7: one cigarette package or small group of cigarettes matching the supplied object
    8: one handheld saw with visible cutting blade and handle or rigid frame
    9: one manual screwdriver with handle and long metal shaft
    10: one metal wrench with visible jaw or ring end
    11: one upright deodorant aerosol spray can with cylindrical metal body, cap and nozzle
    12: one rectangular 9-volt battery with two snap terminals on top
    13: one sealed alcoholic drink bottle or beverage can matching the supplied object
    14: one modern rectangular smartphone with glass screen, bezel and camera
    15: one open laptop with hinged screen, keyboard and trackpad
  prompt_template: >-
    Natural unedited inspection photograph of exactly {target}, {pose} on the
    existing {support}. Preserve the supplied object identity, realistic scale,
    perspective, surface contact and ordinary indoor lighting. No people.
  negative_prompt: >-
    wrong object, duplicate, extra object, deformed, fused, floating, wall-mounted,
    cropped, hidden, oversized, tiny, hand, person, readable text, logo, watermark,
    illustration, painting, cartoon, CGI, 3d render, glossy plastic
