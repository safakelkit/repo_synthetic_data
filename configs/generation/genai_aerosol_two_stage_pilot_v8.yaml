format_version: 8
pilot_id: genai_aerosol_two_stage_v8
status: ready_for_manual_gpu_launch
models_config: configs/generation/genai_models_v1.yaml
scene_policy: configs/generation/genai_scene_policy_v1.yaml
output_root: data/synthetic/pilots/genai_aerosol_two_stage_v8
seed: 16180
output_size: [1024, 1024]
inference_steps: 35
guidance_scale: 6.0
images_per_scene: 2
expected_images: 8
training_use_forbidden: true

stage_1_scene:
  controlnet_conditioning_scale: 0.75
  prompt: >-
    Realistic handheld inspection photograph inside {scene}. One clear empty
    horizontal support surface near the image center, institutional interior,
    natural perspective, ordinary mixed lighting, documentary photography,
    no people, no prominent object, no readable text.
  negative_prompt: >-
    aerosol can, spray can, bottle, prominent foreground object, person, hand,
    readable text, logo, watermark, illustration, cartoon, CGI

stage_2_inpaint:
  controlnet_conditioning_scale: 0.75
  control_guidance_start: 0.0
  control_guidance_end: 0.70
  strength: 0.99
  mask_padding_ratio: 0.16
  mask_blur_radius: 10
  prompt_variants:
    - >-
      One upright retail spray-paint aerosol can on the surface, single tall
      cylindrical metal body, colored graphic wrapper, rounded shoulder,
      plastic cap and push-button nozzle, fully visible, realistic photograph.
    - >-
      One upright deodorant body-spray aerosol can on the surface, single tall
      aluminum cylinder, colored graphic bands, rounded top, plastic cap and
      visible spray actuator, fully visible, realistic photograph.
  negative_prompt: >-
    absent spray can, beverage can, drinking can, plumbing, pipe, faucet,
    fixture, ventilation fan, lamp, thermos, bottle, duplicate object, two cans,
    malformed cylinder, missing top, cropped target, floating target, person,
    hand, readable words, watermark, illustration, cartoon, CGI

silhouette_source:
  audit_manifest: data/processed/object_bank_sam3/asset_audit_manifest.csv
  preferred_stems:
    - IMG_0347new_obj_02_crop_000081
    - IMG_0353new_obj_00_crop_000083
    - IMG_20240806_102126982_obj_01_crop_000137
    - IMG_0534new_obj_01_crop_000155

scene_layouts:
  cell_storage_area: {support_polygon: [[120, 360], [870, 360], [900, 760], [100, 760]], target_box_xyxy: [370, 370, 655, 725]}
  cell_wash_area: {support_polygon: [[80, 520], [930, 500], [1010, 940], [20, 940]], target_box_xyxy: [370, 535, 655, 890]}
  property_inspection_station: {support_polygon: [[130, 440], [894, 440], [1010, 1010], [14, 1010]], target_box_xyxy: [370, 495, 655, 850]}
  maintenance_service_area: {support_polygon: [[160, 390], [880, 420], [940, 850], [90, 820]], target_box_xyxy: [370, 435, 655, 790]}

scene_control_layout:
  canvas_value: 32
  support_value: 128
  target_value: 235
  pre_canny_blur_sigma: 1.0
  canny_thresholds: [80, 160]
  support_jitter_px: 20

target_control_layout:
  canvas_value: 32
  support_value: 128
  target_value: 235
  pre_canny_blur_sigma: 1.0
  canny_thresholds: [80, 160]
  support_jitter_px: 0
  target_center_jitter_px: [22, 12]
  target_scale_factor: [0.82, 0.94]

release_gate:
  production_approved: false
  success_rule: at_least_6_of_8_valid_with_success_in_all_four_scenes
  requires_human_review: true
