    - a worn matte laminate tabletop crosses the lower third, with its front edge visible
    - a scratched timber-look desk occupies the lower foreground, showing grain and rounded edge wear
    - a dull painted-steel workbench fills the near foreground, with small chips but an unobstructed center
    - a compact composite counter enters from one side in convincing perspective, leaving a broad clear area
    - a waist-high institutional sorting table sits close to camera, with a visible edge and realistic surface abrasion
    - a fixed wall ledge spans the lower middle of frame, dry and clear enough for object placement
    - a mismatched side table is nearest the camera, slightly off-center with a plainly visible horizontal top
    - a broad utilitarian counter anchors the foreground, its corners and thickness clearly defined
  composition_profiles:
    - eye-level doorway composition with an off-center vanishing point and layered depth
    - chest-height three-quarter view with the support plane covering roughly the lower quarter
    - slightly elevated oblique view showing both the support surface and room beyond
    - close environmental view with the clear surface prominent but not isolated like a product table
    - wide corner view with partial doorframe occlusion and natural architectural convergence
    - ordinary standing-height view with asymmetric furniture spacing and breathing room around the support
    - restrained handheld framing with one cropped fixed fixture at the edge and no dramatic angle
    - medium-wide inspection view with foreground, middle ground, and background all legible
