    5: The broad cartridge head is firmly joined to its short handle.
    6: The claw head is firmly mounted on one straight handle.
    7: All visible cigarettes remain seated vertically inside the opened pack.
    8: The rigid frame holds one thin toothed blade at both ends, beside a single grip.
