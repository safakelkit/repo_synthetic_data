    - aging fluorescent tubes with uneven brightness, slightly green highlights, and darker corners
    - mixed cool window light and warmer corridor spill through the doorway
    - low winter daylight from a high window with practical ceiling fixtures switched on
    - late-afternoon side light softened by blinds, with believable exposure variation
    - flat cloudy daylight, muted colors, and no dramatic cinematic shadows
    - warm older ceiling lamps mixed with cool service-area light in the distance
    - bright but non-studio ambient light with localized falloff beneath shelves and furniture
  material_profiles:
    - blockwork, laminate, steel, sealant and flooring retain distinct roughness
    - old and new repairs differ subtly in hue, sheen and edge wear
    - porous masonry, brushed metal, molded plastic and wood remain distinct
    - reflections are subdued and uneven, with credible fixture contact shadows
    - floor seams, wall texture and furniture edges show realistic construction
    - mixed material ages create restrained variation without decorative styling
    - touched edges are smoother while recesses retain duller paint
    - maintained utilitarian finishes show restrained abrasion and patching
