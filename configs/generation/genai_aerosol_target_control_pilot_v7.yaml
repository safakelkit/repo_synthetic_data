format_version: 7
pilot_id: genai_aerosol_target_control_v7
status: ready_for_manual_gpu_launch
models_config: configs/generation/genai_models_v1.yaml
scene_policy: configs/generation/genai_scene_policy_v1.yaml
generation_policy: configs/generation/genai_generation_policy_v1.yaml
backends: [sdxl]
output_root: data/synthetic/pilots/genai_aerosol_target_control_v7
seed: 27182
output_size: [1024, 1024]
inference_steps: 35
guidance_scale: 6.5
controlnet_conditioning_scale: 0.70
control_guidance_start: 0.0
control_guidance_end: 0.65
target_conditioning_mode: target_only
prompt_order: target_first

pilot_scope:
  class_ids: [11]
  images_per_class_scene: 2
  expected_images_per_backend: 8
  covers_all_assigned_scene_families: true
  annotation_performed: false
  degradation_applied: false
  training_use_forbidden: true

silhouette_source:
  audit_manifest: data/processed/object_bank_sam3/asset_audit_manifest.csv
  use_rgb_or_rgba_pixels: false
  selection_seed_offset: 1000
  preferred_stems:
    11:
      - IMG_0347new_obj_02_crop_000081
      - IMG_0353new_obj_00_crop_000083
      - IMG_20240806_102126982_obj_01_crop_000137
      - IMG_0534new_obj_01_crop_000155

class_rotation_degrees:
  11: [0]
class_controlnet_conditioning_scales:
  11: [0.65, 0.80]
class_target_phrases:
  11:
    - one ordinary upright spray-paint can, a single tall cylindrical metal can with a colored product wrapper, rounded shoulder, plastic cap, and small push-button spray nozzle
    - one ordinary upright deodorant body-spray can, a single tall cylindrical aluminum can with colored graphic bands, rounded top, plastic cap, and visible spray nozzle
    - one upright cleaning-product spray can, a single cylindrical pressurized metal can with a bright cap and push-button aerosol nozzle
    - one upright spray-paint can, a single tall round metal can with a colored wrapper, distinct plastic cap, and small spray actuator
class_negative_additions:
  11:
    - plumbing
    - pipe
    - faucet
    - sink fixture
    - ventilation fan
    - lamp
    - wall-mounted object
    - bracket
    - dispenser
    - remote control
    - electronic device
    - thermos flask
    - drinking cup

scene_layouts:
  cell_storage_area: {support_polygon: [[120, 360], [870, 360], [900, 760], [100, 760]], target_box_xyxy: [315, 345, 710, 775]}
  cell_wash_area: {support_polygon: [[80, 520], [930, 500], [1010, 940], [20, 940]], target_box_xyxy: [315, 485, 710, 915]}
  property_inspection_station: {support_polygon: [[130, 440], [894, 440], [1010, 1010], [14, 1010]], target_box_xyxy: [315, 470, 710, 900]}
  maintenance_service_area: {support_polygon: [[160, 390], [880, 420], [940, 850], [90, 820]], target_box_xyxy: [315, 400, 710, 830]}

control_layout:
  canvas_value: 32
  support_value: 128
  target_value: 235
  semantic_edge_value: 32
  pre_canny_blur_sigma: 1.0
  canny_thresholds: [80, 160]
  support_jitter_px: 0
  target_center_jitter_px: [35, 20]
  target_scale_factor: [0.92, 1.0]

prompt:
  prefix: A realistic handheld inspection photograph inside a correctional facility.
  suffix: >-
    Product photo subject: {target}. The spray can is the clear main subject,
    standing vertically near the center on a horizontal surface, fully visible,
    unobstructed, and large enough for a reliable bounding box. It has the
    unmistakable proportions and top hardware of a retail aerosol spray can.
  negative: >-
    absent spray can, wrong primary object, multiple spray cans, duplicate object,
    malformed cylinder, cropped target, hidden target, floating target, hand,
    person, readable words, watermark, illustration, cartoon, CGI

release_gate:
  canonical_generation_approved: false
  success_rule: at_least_6_of_8_valid_with_success_in_all_four_scenes
  requires_human_review: true
