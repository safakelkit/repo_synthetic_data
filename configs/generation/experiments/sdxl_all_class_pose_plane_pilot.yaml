base_config: configs/generation/experiments/sdxl_all_class_source_inpaint_64.yaml
format_version: 1
experiment_id: sdxl_all_class_pose_plane_pilot
status: ready_for_experiment

# Flat classes are homography-warped into the photographed support plane.
# Upright and hinged classes retain their camera pose and are pinned by their
# bottom edge to the same support point.
pose_class_modes:
  0: flat
  1: flat
  2: flat
  3: flat
  4: flat
  5: flat
  6: flat
  7: upright
  8: flat
  9: flat
  10: flat
  11: upright
  12: upright
  13: upright
  14: flat
  15: hinged

# For flat objects this is the apparent long side. For upright/hinged objects
# it is the rendered height. Values are conservative at 1024x1024.
pose_target_size_px:
  0: 150
  1: 150
  2: 180
  3: 190
  4: 190
  5: 155
  6: 210
  7: 140
  8: 220
  9: 190
  10: 200
  11: 190
  12: 105
  13: 160
  14: 165
  15: 200

pose_mask_padding_px: 20
pose_strength_by_mode:
  flat: 0.55
  upright: 0.62
  hinged: 0.58
pose_canny_scale_by_mode:
  flat: 0.68
  upright: 0.78
  hinged: 0.70
pose_strength_overrides:
  11: 0.75
pose_canny_scale_overrides:
  11: 0.90

pose_prompt_phrases:
  flat: lying flat with its whole body supported by the horizontal surface and a tight contact shadow
  upright: standing upright with its bottom base touching the horizontal surface and a tight contact shadow
  hinged: open normally with its lower base resting completely on the horizontal surface and a tight contact shadow

pose_prompt_template: >-
  Photo of {target}, {pose}, fully visible at realistic scale and matching the
  surface perspective. {scene}. No people.

pose_negative_prompt: >-
  wrong object, duplicates, extra tools, deformed, fused, embedded in furniture,
  wall-mounted, attached to wall, hanging, suspended, floating, balancing on one
  tip, standing on an edge, cropped, hidden, oversized, tiny, hand, person,
  readable text, logo, watermark, illustration, cartoon, CGI

# Each center is on a visually confirmed support surface in the immutable plate.
# u follows the surface width; v follows its near/far direction. Compression
# controls the apparent depth of a flat object on that plane.
pose_plane_placements:
  cell_sleeping_area:
    0:
      center_xy: [650, 585]
      surface_axis_u: [1.0, 0.03]
      surface_axis_v: [-0.12, 1.0]
      depth_compression: 0.48
    1:
