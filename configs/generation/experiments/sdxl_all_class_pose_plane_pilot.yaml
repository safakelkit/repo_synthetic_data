# These accepted sources have a clear class silhouette and useful internal
# structure for the low-strength identity-preserving branch.
silhouette_source:
  preferred_stems:
    5: [IMG_0375new_obj_00_crop_000045]
    8: [IMG_20240806_105616745_obj_00_crop_000036]
    14: [IMG_0494new_obj_00_crop_000044]
    15: [IMG_0171new_obj_00_crop_000019]

# The accepted real assets inside these semantic classes include multiple valid
# forms. These prompts describe the selected silhouette instead of contradicting it.
inpaint_all_target_prompts:
  1: exactly one safety-match item matching the supplied outline, either a matchbox with wooden matches or a single wooden match
  7: exactly one tobacco-cigarette item matching the supplied outline, either a cigarette package or a small group of cigarettes
  8: exactly one handheld saw matching the supplied outline, with a visible cutting blade and handle or rigid frame
  13: exactly one sealed alcoholic drink container matching the supplied outline, either a small glass bottle or beverage can

pose_prompt_phrases:
  flat: lying flat and fully supported on a horizontal surface, tight contact shadow
  upright: upright with its flat base touching a horizontal surface, tight contact shadow
  hinged: open with its lower base fully supported on a horizontal surface, tight contact shadow

pose_prompt_template: >-
  Photorealistic {target}, {pose}, realistic scale. {scene}. No people.

pose_negative_prompt: >-
  wrong object, duplicates, extra tools, deformed, fused, embedded in furniture,
  wall-mounted, attached to wall, hanging, suspended, floating, balancing on one
  tip, standing on an edge, cropped, hidden, oversized, tiny, hand, person,
  readable text, logo, watermark, illustration, cartoon, CGI

# Each center is on a visually confirmed support surface in the immutable plate.
# u follows the surface width; v follows its near/far direction. Compression
# controls the apparent depth of a flat object on that plane.
