format_version: 1
experiment_id: sdxl_reference_plate_pilot_v1
status: ready_for_experiment
models_config: configs/generation/genai_models_v1.yaml
output_root: data/synthetic/sdxl_v2_development/reference_plate_pilot_v1

# The sources and their support regions were already reviewed for cut/paste.
# This pilot never reads target-test images and cannot become training-ready
# until the derived plates receive a new visual review.
source:
  eligible_backgrounds: data/processed/background_support_masks/sam3_v2/full_geometry_v2/eligible_backgrounds.csv
  reviewed_support_regions: data/processed/background_support_masks/sam3_v2/full_geometry_v2/reviewed_support_regions.csv
  required_status: accepted
  support_types: [bed_top, dining_table_top]
  samples_per_support_type: 8
  selection_seed: 91350
  maximum_source_reuse: 1
  dataset_id: ljnlonoljpiljm/places365-256px
  dataset_revision: historically_unrecorded

generation:
  width: 1024
  height: 1024
  inference_steps: 30
  guidance_scale: 4.5
  strengths: [0.20, 0.28]
  seed: 91400
  prompts:
    bed_top: >-
      A natural unedited documentary photograph of the same empty bed surface
      and surrounding plain institutional sleeping area. Preserve the camera
      viewpoint, bed position, perspective, and clear support surface. Subtle
      fabric wear, ordinary mixed indoor light, realistic materials and sensor noise.
    dining_table_top: >-
      A natural unedited documentary photograph of the same empty table surface
      and surrounding plain institutional multipurpose room. Preserve the camera
      viewpoint, table position, perspective, and clear support surface. Subtle
      surface wear, ordinary mixed indoor light, realistic materials and sensor noise.
  negative_prompt: >-
    changed composition, missing horizontal support, distorted perspective,
    warped furniture, cluttered surface, person, hand, tools, weapons,
    contraband, aerosol can, text, logo, watermark, illustration, painting,
    cartoon, CGI, 3d render, showroom, glossy plastic, oversmoothed

review_gate:
  training_use_forbidden: true
  required_fields:
    - organic_realism
    - physical_geometry
    - source_geometry_preserved
    - support_surface_preserved
    - target_free
    - duplicate_free
  acceptance_target_overall: 13
  acceptance_target_per_support_type: 6
