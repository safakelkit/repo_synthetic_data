format_version: 1
experiment_id: sdxl_reference_plate_pilot_v3
status: ready_for_experiment
models_config: configs/generation/genai_models_v1.yaml
output_root: data/synthetic/sdxl_v2_development/reference_plate_pilot_v3

source:
  eligible_backgrounds: data/processed/background_support_masks/sam3_v2/full_geometry_v2/eligible_backgrounds.csv
  reviewed_support_regions: data/processed/background_support_masks/sam3_v2/full_geometry_v2/reviewed_support_regions.csv
  required_status: accepted
  support_types: [bed_top, dining_table_top]
  samples_per_support_type: 4
  selection_seed: 91350
  maximum_source_reuse: 1
  dataset_id: ljnlonoljpiljm/places365-256px
  dataset_revision: historically_unrecorded

generation:
  mode: support_inpaint
  width: 1024
  height: 1024
  inference_steps: 30
  guidance_scale: 4.5
  strengths: [0.78, 0.92]
  seed: 91600
  support_crop:
    enabled: true
    context_scale: 1.8
    minimum_source_fraction: 0.55
  inpaint_mask_dilation_pixels: 8
  prompts:
    bed_top: >-
      The same natural documentary photograph, with the masked area replaced
      by an empty unobstructed bed top matching the existing bed perspective,
      fabric, seams, wear, shadows, and ordinary indoor light. Real photograph.
    dining_table_top: >-
      The same natural documentary photograph, with the masked area replaced
      by an empty unobstructed tabletop matching the existing table perspective,
      material, wear, reflections, shadows, and ordinary indoor light. Real photograph.
  negative_prompt: >-
    object on surface, clutter, changed composition, missing support, distorted
    perspective, warped furniture, person, hand, tools, weapons, contraband,
    aerosol can, text, logo, watermark, illustration, painting, cartoon, CGI,
    3d render, glossy plastic, oversmoothed

review_gate:
  training_use_forbidden: true
  required_fields:
    - organic_realism
    - physical_geometry
    - unmasked_context_preserved
    - support_surface_usable
    - inpaint_seam_free
    - target_free
    - duplicate_free
  acceptance_target_overall: 6
  acceptance_target_per_support_type: 3

