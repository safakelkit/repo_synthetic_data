target_prompts:
  1: >-
    One open cardboard matchbox with wooden safety matches, resting flat on a
    horizontal surface with a natural contact shadow, fully visible.
  2: >-
    One pair of household scissors with two handles and two metal blades, resting
    flat on a horizontal surface with a natural contact shadow, fully visible.
  11: >-
    One upright deodorant aerosol spray can, cylindrical metal body, rounded cap
    and push-button nozzle, flat base visibly touching a horizontal surface with
    a natural contact shadow, fully visible, not spraying.
direct_aerosol_prompt: >-
  Photo of exactly one deodorant spray can centered on a foreground counter,
  one quarter of image height. Cylindrical metal body, colored label, rounded
  cap, visible push-button nozzle, flat base touching counter, contact shadow.
  {scene}. Empty fixed furniture. No people.
direct_aerosol_negative_prompt: >-
  multiple cans, duplicate can, extra aerosol, bottles, jars, containers,
