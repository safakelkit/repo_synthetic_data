base_config: configs/generation/experiments/sdxl_pose_background_diversity_32.yaml
format_version: 1
experiment_id: sdxl_v2_background_source_review
status: ready_for_experiment
output_root: data/synthetic/sdxl_v2_development

# This configuration intentionally stops after target-free background creation.
# Selected plates need visual review and support-plane annotation before any
# target object can be rendered into them.
allowed_stages: [plates]
plate_variants_per_scene: 40
plate_acceptance_target_per_scene: 32
plate_seed: 91000
plate_seed_overrides: {}

# Cycle through every accepted SAM3 asset in a stable seed-derived order before
# reusing one. At 128 samples/class this gives 39--128 unique sources/class and
# caps reuse at four even for the smallest accepted class pool.
silhouette_source:
  selection_strategy: balanced_seeded_cycle
  selection_seed_offset: 3000
  projected_samples_per_class: 128
  minimum_unique_per_class: 32
  maximum_reuse_per_asset: 4

source_review_gate:
  candidates_per_class: 40
  required_accepted_per_class: 32
  reject_if:
    - crop contains the wrong class or multiple inseparable objects
    - alpha mask removes a class-defining part or includes unrelated content
    - object form cannot be assigned a physically valid flat, upright, or hinged pose
    - source is a near duplicate of another accepted source
    - class-defining details are unreadable at the planned rendered size

# Five physical layouts x four viewpoints x two illumination conditions = 40
# candidates per scene. Human review will retain 32 per scene (25% surplus).
structured_plate_prompts:
  realism_prefix: >-
    Ordinary unedited facilities survey photograph, neutral exposure, not staged.
  realism_suffix: >-
    Natural perspective, irregular wear, sensor texture, empty support surface, no people.
  viewpoints:
    - Eye-level doorway view.
    - Off-center three-quarter view.
    - Side-angle view with foreground depth.
    - Opposite-corner view with natural occlusion.
  lightings:
    - Mixed daylight and fluorescent light, realistic shadows.
    - Uneven warm lighting with dim daylight, realistic shadows.
  scene_blueprints:
    cell_sleeping_area:
      - Inside a compact prison sleeping cell; a complete steel bunk bed is clearly visible with a closed locker and secure window.
      - Inside an older correctional sleeping cell; stacked metal bunks dominate the room beside a fixed shelf and solid door.
      - Inside a narrow housing cell; one complete bed is plainly visible beside recessed storage and a worn writing ledge.
      - Inside a renovated prison sleeping cell; a bolted bed is the main fixture with a sealed cabinet and high secure window.
      - Inside a heavily used prison sleeping cell; a complete metal bed and closed storage are clearly visible amid mismatched repairs.
    cell_desk_area:
      - Inside a prison-cell writing alcove; a broad completely empty fixed desk fills the foreground below a high secure window.
      - Inside a worn detention study corner; a wide bare steel writing counter dominates the foreground beside a closed locker.
      - Inside a compact housing-cell workspace; a clear wall-mounted concrete desk is fully visible against painted block walls.
      - Inside an older prison-cell workspace; a repaired empty worktop and sealed cubby dominate the foreground.
      - Inside a secure institutional writing bay; a long completely bare counter is plainly visible below a high secure window.
    cell_storage_area:
      - Inside a secure prison linen store; fixed shelves of folded neutral bedding and closed lockers fill the room.
      - Inside a correctional property store; numbered cabinets, a wire cage and a broad empty packing bench are clearly visible.
      - Inside a narrow institutional storeroom; steel shelving, sealed bins and a controlled door define the room.
      - Inside an older correctional evidence store; closed cupboards, a mesh partition and an empty sorting counter dominate the view.
      - Inside a compact prison supply store; linen racks, locked cabinets and a clear packing surface are fully visible.
    cell_wash_area:
      - Inside a detention wash alcove; a complete porcelain basin and dry side counter are clearly visible against aged tile.
      - Inside a secure institutional washroom; a row of stainless basins and a long mirror dominate the room.
      - Inside an older correctional wash bay; a deep fixed sink, tiled privacy return and bare metal shelf are fully visible.
      - Inside a renovated prison wash area; a fixed basin set in a broad concrete counter is the main fixture.
      - Inside a narrow correctional washroom; a complete basin row and a clear dry ledge are plainly visible against patched tile.
    communal_day_room:
      - Inside a prison communal day room; complete bolted tables and attached seats dominate the space below secure windows.
      - Inside an older correctional common room; fixed benches and a heavy central table are clearly visible near a controlled door.
      - Inside a compact prison housing-unit day room; a heavy table, molded seats and mesh divider define the space.
      - Inside a renovated secure common room; multiple complete pieces of fixed furniture are clearly visible below high windows.
      - Inside a worn correctional communal room; two bolted tables and repaired benches dominate an asymmetric layout.
    property_inspection_station:
      - Inside a prison intake property-search room; one broad empty inspection table fills the foreground before numbered lockers.
      - Inside a secure correctional property station; one long bare processing counter dominates the foreground below an acrylic divider.
      - Inside a prison intake search bay; a completely empty metal inspection worktop fills the foreground before closed cabinets.
      - Inside a correctional evidence intake room; one repaired bare sorting counter dominates the foreground beside sealed cupboards.
      - Inside a prison property-processing station; a clear L-shaped inspection bench fills the foreground before a glazed divider.
    correctional_workshop:
      - Inside a cleared prison vocational workshop after inventory removal; one completely bare steel workbench fills the foreground.
      - Inside a decommissioned correctional maintenance shop; a wide empty timber bench and closed cabinets dominate the room.
      - Inside a cleared older prison workshop; one repaired bare assembly bench fills the foreground before sealed cupboards.
      - Inside an empty secure vocational room after tool removal; a clean steel worktop and locked caged storage are fully visible.
      - Inside a cleared renovated prison workshop; one broad empty assembly bench dominates the room before closed cabinets.
    maintenance_service_area:
      - Inside a prison electrical utility room; breaker enclosures and exposed conduit surround a broad clear concrete floor.
      - Inside a correctional mechanical service bay; ventilation machinery and locked equipment cabinets are clearly visible.
      - Inside a prison boiler and mechanical room; pipe runs and electrical enclosures define the room around a clear floor.
      - Inside an older correctional facilities room; cable trays and closed service panels surround a clear concrete floor zone.
      - Inside a compact prison ventilation plant room; ductwork, sealed cabinets and utility doors are fully visible.

plate_negative_prompt: >-
  CGI, 3D render, illustration, painting, concept art, showroom, perfect symmetry,
  plastic texture, warped architecture, impossible perspective, floating fixtures,
  fisheye, cinematic grading, generic empty room, empty hallway, people, hands,
  readable text, logo, watermark

scene_plate_negative_prompts:
  cell_desk_area: >-
    tiny desk, paper, books, office supplies, cluttered desktop, broken chair, art studio
  property_inspection_station: >-
    workshop, kitchen, classroom, laboratory, medical room, sinks, loose equipment, clutter
  correctional_workshop: >-
    saws, hammers, screwdrivers, wrenches, pliers, knives, aerosol cans
  maintenance_service_area: >-
    hospital, medical room, laundry, kitchen, fabric, examination table, operating room

background_review_gate:
  candidate_count: 320
  required_accepted_count: 256
  required_per_scene: 32
  reject_if:
    - scene identity is incorrect or ambiguous
    - image looks like CGI, illustration, showroom, or cinematic concept art
    - walls, furniture, doors, or perspective have impossible geometry
    - no continuous empty support surface can be annotated safely
    - a project target class, person, hand, readable logo, or watermark is visible
    - image is a near duplicate of another accepted plate
