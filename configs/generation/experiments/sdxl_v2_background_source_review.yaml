base_config: configs/generation/experiments/sdxl_pose_background_diversity_32.yaml
format_version: 1
experiment_id: sdxl_v2_background_source_review
status: ready_for_experiment
output_root: data/synthetic/sdxl_v2_development

# This configuration intentionally stops after target-free background creation.
# Selected plates need visual review and support-plane annotation before any
# target object can be rendered into them.
allowed_stages: [plates]
plate_variants_per_scene: 40
plate_acceptance_target_per_scene: 32
plate_seed: 91000
plate_seed_overrides: {}

# Cycle through every accepted SAM3 asset in a stable seed-derived order before
# reusing one. At 128 samples/class this gives 39--128 unique sources/class and
# caps reuse at four even for the smallest accepted class pool.
silhouette_source:
  selection_strategy: balanced_seeded_cycle
  selection_seed_offset: 3000
  projected_samples_per_class: 128
  minimum_unique_per_class: 32
  maximum_reuse_per_asset: 4

source_review_gate:
  candidates_per_class: 40
  required_accepted_per_class: 32
  reject_if:
    - crop contains the wrong class or multiple inseparable objects
    - alpha mask removes a class-defining part or includes unrelated content
    - object form cannot be assigned a physically valid flat, upright, or hinged pose
    - source is a near duplicate of another accepted source
    - class-defining details are unreadable at the planned rendered size

# Five support-surface layouts x four close viewpoints x two illumination
# conditions = 40 candidates per scene. The close composition is derived from
# INSP-DET train imagery and the approved cut/paste support geometry, never from
# target-test metrics or frames. Human review retains 32 per scene.
structured_plate_prompts:
  realism_prefix: >-
    Unedited handheld inspection photograph, neutral exposure.
  realism_suffix: >-
    Natural wear, sensor noise, perspective, no people.
  viewpoints:
    - Close oblique view; the support surface fills the lower two thirds of the frame.
    - Close overhead three-quarter view; the support surface dominates the frame.
    - Handheld near-side view with the support edge visible in the foreground.
    - Close opposite-side view with shallow background context and natural cropping.
  lightings:
    - Mixed daylight and fluorescent light, realistic shadows.
    - Uneven warm lighting with dim daylight, realistic shadows.
  scene_blueprints:
    cell_sleeping_area:
      - A broad bare gray prison mattress on a steel bunk; the clean fabric surface is the main subject with cell wall context at the edges.
      - A worn but empty blue institutional mattress on a bolted bed; the uninterrupted mattress top dominates the image.
      - A neatly made correctional bunk with plain neutral bedding; the flat bed surface fills most of the foreground.
      - An empty vinyl-covered detention mattress on a steel frame; subtle seams and wear are visible across the clear top.
      - A plain prison bed with a taut beige blanket; the unobstructed bedding surface dominates with a locker softly behind it.
    cell_desk_area:
      - A broad completely bare gray laminate prison-cell desk; its uninterrupted desktop fills most of the frame.
      - A worn empty steel writing counter fixed to a correctional wall; scratches and the front edge are clearly visible.
      - A clear wall-mounted concrete cell desk; the flat top dominates with painted block wall softly behind it.
      - A repaired empty institutional worktop with sealed drawers; the unobstructed surface fills the foreground.
      - A long bare secure writing shelf below a high window; the plain horizontal top is the main subject.
    cell_storage_area:
      - A wide empty steel shelf inside a secure property locker; the scuffed shelf base fills most of the image.
      - A bare laminate packing bench beside closed correctional lockers; the clear bench top dominates the foreground.
      - An empty painted-metal storage shelf in an institutional storeroom; its uninterrupted base is seen close up.
      - A broad bare sorting counter before a mesh property cage; natural scratches cover the clear horizontal surface.
      - An empty lower cabinet shelf in a prison supply store; the flat shelf and front lip dominate the frame.
    cell_wash_area:
      - A broad dry porcelain counter beside a detention basin; the clean counter section dominates with aged tile at the edge.
      - A long bare stainless washroom counter beside fixed basins; the dry uninterrupted section fills the foreground.
      - An empty metal shelf beside an older correctional sink; the clear shelf top dominates against patched tile.
      - A wide dry concrete counter surrounding a secure fixed basin; the empty side section fills most of the image.
      - A clear institutional washroom ledge beside a basin row; worn grout and steel fixtures remain peripheral.
    communal_day_room:
      - A large completely empty white laminate table in a prison day room; the tabletop fills most of the image.
      - A worn bare institutional wood table beside fixed benches; grain and edge dominate with secure windows softly behind.
      - A clear gray molded table bolted in a housing-unit day room; its uninterrupted top fills the foreground.
      - A broad empty pale communal-room tabletop; subtle scratches and rounded edge are visible at close range.
      - A repaired bare correctional table with a dark metal rim; the clear top dominates an asymmetric handheld view.
    property_inspection_station:
      - A broad empty stainless prison property-inspection table; brushed metal and the near edge fill most of the frame.
      - A long bare laminate processing counter below an acrylic divider; the uninterrupted top dominates the image.
      - A completely empty metal intake-search worktop; natural scuffs cover the clear surface with lockers softly behind.
      - A repaired bare evidence-sorting counter beside sealed cupboards; the horizontal top fills the foreground.
      - A clear L-shaped property-processing bench before a glazed divider; its empty work surface dominates the close view.
    correctional_workshop:
      - A completely cleared steel prison-workshop bench after inventory removal; the bare scratched worktop fills the frame.
      - A wide empty timber vocational bench with all tools removed; natural grain and wear dominate the close image.
      - A repaired bare correctional assembly table before sealed cupboards; its unobstructed top fills the foreground.
      - A clean empty steel worktop in a secure vocational room; the flat surface dominates with caged storage softly behind.
      - A broad cleared prison maintenance bench before closed cabinets; the uninterrupted assembly surface fills the image.
    maintenance_service_area:
      - A broad empty steel service counter inside a prison utility room; its bare top dominates with conduit softly behind.
      - A clear painted-metal maintenance shelf beside locked equipment cabinets; the shelf base fills most of the frame.
      - An empty industrial work ledge in a correctional mechanical room; the scuffed horizontal surface dominates.
      - A wide bare facilities counter below closed electrical panels; the clear top and front edge fill the foreground.
      - A clean empty utility shelf beside ventilation ductwork; its uninterrupted support surface dominates the close image.

plate_negative_prompt: >-
  CGI, 3D render, illustration, painting, concept art, showroom, perfect symmetry,
  plastic texture, warped architecture, impossible perspective, floating fixtures,
  fisheye, cinematic grading, wide room view, distant support surface, people,
  hands, readable text, logo, watermark

scene_plate_negative_prompts:
  cell_desk_area: >-
    tiny desk, paper, books, office supplies, cluttered desktop, broken chair, art studio
  property_inspection_station: >-
    workshop, kitchen, classroom, laboratory, medical room, sinks, loose equipment, clutter
  correctional_workshop: >-
    saws, hammers, screwdrivers, wrenches, pliers, knives, aerosol cans
  maintenance_service_area: >-
    hospital, medical room, laundry, kitchen, fabric, examination table, operating room

background_review_gate:
  candidate_count: 320
  required_accepted_count: 256
  required_per_scene: 32
  reject_if:
    - scene identity is incorrect or ambiguous
    - image looks like CGI, illustration, showroom, or cinematic concept art
    - walls, furniture, doors, or perspective have impossible geometry
    - no continuous empty support surface can be annotated safely
    - a project target class, person, hand, readable logo, or watermark is visible
    - image is a near duplicate of another accepted plate
