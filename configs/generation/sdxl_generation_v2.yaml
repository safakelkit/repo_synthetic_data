format_version: 2
base_config: configs/generation/sdxl_generation_v1.yaml
pipeline_id: sdxl_generation_v2
status: ready_for_acceptance_test
output_root: data/synthetic/sdxl_generation_v2/acceptance_test
seed: 54000
guidance_scale: 6.0

# Put the requested object before the setting.  The existing Canny geometry
# continues to control the 15 silhouette-conditioned classes.
prompt_order: target_first
scene_prompt_include_base: false
scene_prompt_profile_max_words: 16

prompt:
  target_first_template: "{target}"
  prefix: "Documentary evidence photo."
  suffix: >-
    Centered, fully visible, useful detection scale, no people or readable text.
  negative: >-
    duplicate target, wrong primary object, deformed target, floating object,
    cropped target, hidden target, hand, person, readable text, logo,
    watermark, illustration, cartoon, CGI

# These profiles are text-only scene detail.  They add architectural and
# non-target contextual diversity without placing other project classes in the
# background.  Selection is deterministic from the global sample index.
scene_prompt_profiles:
  cell_sleeping_area:
    - >-
      Medium-close view over a brushed-steel bedside shelf beside a neatly made
      bunk, with a folded blanket, wall reading light, and high barred window
      softly visible behind the subject; all secondary surfaces are clear.
    - >-
      Oblique inspection-table view in a compact cell, with a bolted bed frame,
      plain mattress edge, concrete wall, and empty recessed shelf in the
      background; no loose personal objects.
    - >-
      Low documentary angle across a small fixed laminate table in a sleeping
      cell, with an unoccupied bunk, closed locker door, and ceiling light in
      the background; clean secondary surfaces.
    - >-
      Overhead evidence view of a plain tray on a narrow institutional desk,
      with folded bedding and a blank wall notice board far behind; no visible
      handheld objects.
  cell_desk_area:
    - >-
      Three-quarter view of a scratched laminate desk with a bolted stool,
      closed storage cubbies, and an empty pinboard in the background.
    - >-
      Close inspection view across a fixed metal writing desk, with an
      institutional chair, recessed shelf, and frosted window softly out of
      focus behind it.
    - >-
      Eye-level view over a clean evidence tray on a cell desk, with blank
      folders stored in a closed wall rack and a plain concrete wall behind.
    - >-
      Slightly elevated view of a compact desk surface, with a bolted seat,
      empty drawers, and soft daylight from a high secure window.
  cell_storage_area:
    - >-
      Close view of a shallow tray on a folding cart in front of open locker
      bays, folded fabric, empty translucent storage bins, and closed cabinet
      doors; no foreground clutter.
    - >-
      Medium inspection view of a plain steel shelf in a storage alcove, with
      orderly blank boxes, empty cubbies, and a wire-mesh partition behind it.
    - >-
      Oblique view across a clean cabinet-top tray, with open locker doors,
      stacked folded linen, and a distant institutional corridor softly blurred.
    - >-
      Overhead view of a small storage counter, with neutral shelving,
      transparent empty bins, and an unoccupied locker wall in the background.
  cell_wash_area:
    - >-
      Evidence-tray view beside a fixed porcelain washbasin, with tiled walls,
      a towel rail, drain hardware, and an empty recessed shelf in the
      background.
    - >-
      Medium-close view over a stainless counter in a compact wash area, with
      pale ceramic tiles, a plain mirror, and folded towels kept behind the
      subject.
    - >-
      Slightly elevated inspection view of a clean tray near a wall basin, with
      a secure window, tiled backsplash, and uncluttered counter surfaces.
    - >-
      Side view across a brushed-metal shelf in a wash room, with an empty
      soap recess, porcelain sink edge, and institutional lighting.
  communal_day_room:
    - >-
      Medium evidence view across a plain table in a shared day room, with
      bolted seating, an empty notice board, and tall secure windows in the
      distance.
    - >-
      Low angle over a clean tray on a communal table, with rows of empty
      molded seats, a muted tiled floor, and closed storage cabinets behind it.
    - >-
      Three-quarter inspection view from a day-room table, with a service
      counter, blank wall panels, and soft overhead fluorescent lighting.
    - >-
      Slightly elevated view of a central table surface, with unoccupied
      benches, a secure doorway, and neutral institutional furnishing behind.
  property_inspection_station:
    - >-
      Close-medium evidence photograph over a stainless inspection table, with
      empty acrylic dividers, sealed blank paperwork sleeves, and closed
      storage cabinets in the background.
    - >-
      Overhead view of a clean evidence tray on a property-search counter,
      with empty clear bins, a plain pass-through window, and neutral wall
      panels behind it.
    - >-
      Three-quarter inspection-table view with a blank rolling cart, closed
      drawers, and a softly blurred secure corridor in the background.
    - >-
      Documentary view across a brushed-metal search table, with orderly empty
      trays, a wall-mounted checklist board without readable text, and sealed
      cabinet doors behind.
  correctional_workshop:
    - >-
      Medium evidence view over a clean workbench tray, with an empty
      pegboard, closed parts drawers, and a wide workshop aisle in the
      background; no loose tools are visible.
    - >-
      Low inspection angle across a plain laminated bench, with blank storage
      cabinets, empty hooks, and diffuse workshop lighting behind it.
    - >-
      Three-quarter view of a tray on a controlled workshop table, with an
      unoccupied assembly surface, neutral wall panels, and closed drawers.
    - >-
      Slightly elevated documentary view of a workbench, with empty shelving,
      a wire partition, and a clear floor area behind the subject.
  maintenance_service_area:
    - >-
      Medium-close evidence view over a stainless utility counter, with closed
      gray cabinets, a clear rolling cart, cable conduit, and a service door in
      the background.
    - >-
      Three-quarter inspection view of a clean tray in a utility room, with
      empty wall shelving, a ventilation grille, and muted overhead lighting.
    - >-
      Low angle across a plain maintenance bench, with closed equipment
      cabinets, blank wall panels, and an uncluttered service corridor behind.
    - >-
      Slightly elevated view of a metal service counter, with a locked storage
      cage, clear floor space, and neutral institutional fixtures in the back.

# Aerosol intentionally stays text-conditioned: no source silhouette, no
# target Canny, and zero ControlNet influence.  The product name is phrased as
# a familiar consumer spray item and appears before the scene description.
aerosol_full_scene:
  prompt_variants:
    - >-
      One upright spray paint can, centered and large on a clean inspection
      tray. Cylindrical metal body, plastic cap, visible spray nozzle.
      {background}. Documentary evidence photo, no people.
    - >-
      One upright deodorant spray can, centered and fully visible on a clean
      inspection surface. Metal cylinder, rounded cap, distinct spray actuator.
      {background}. Documentary evidence photo, no people.
    - >-
      One spray paint can on a plain central tray, large and fully visible.
      Colored wrapper, metal base, plastic overcap, push-button nozzle.
      {background}. Documentary evidence photo, no people.
    - >-
      One upright personal body-spray can in the center foreground on an
      inspection table. Clear cylinder, cap, and spray button at useful scale.
      {background}. Documentary evidence photo, no people.
  negative_prompt: >-
    bottle, beverage container, thermos, pipe, faucet, plumbing fixture,
    ventilation equipment, distant product, empty room, duplicate foreground
    product, malformed cylinder, cropped object, hand, person, readable words,
    watermark, illustration, cartoon, CGI

scene_negative_additions:
  cell_sleeping_area: [additional loose handheld objects in background]
  cell_desk_area: [additional loose handheld objects in background]
  cell_storage_area: [additional loose handheld objects in background]
  cell_wash_area: [additional loose handheld objects in background]
  communal_day_room: [additional loose handheld objects in background]
  property_inspection_station: [additional loose handheld objects in background]
  correctional_workshop: [additional loose handheld objects in background]
  maintenance_service_area: [additional loose handheld objects in background]
