    rectangles: [[[0.24, 0.12], [0.76, 0.30]]]
    lines: [[[0.32, 0.19], [0.68, 0.19]], [[0.50, 0.30], [0.50, 0.86]]]
  12:
    thickness_ratio: 0.018
    rectangles: [[[0.20, 0.08], [0.80, 0.28]]]
    circles: [[[0.35, 0.17], 0.060], [[0.65, 0.17], 0.040]]
  14:
    thickness_ratio: 0.018
    rectangles: [[[0.15, 0.12], [0.85, 0.88]]]
    circles: [[[0.50, 0.08], 0.030]]

scene_layouts:
  cell_sleeping_area: {support_polygon: [[90, 500], [850, 460], [1000, 990], [20, 990]], target_box_xyxy: [350, 555, 665, 825]}
  cell_desk_area: {support_polygon: [[180, 430], [900, 470], [930, 930], [100, 900]], target_box_xyxy: [390, 500, 700, 790]}
  cell_storage_area: {support_polygon: [[120, 360], [870, 360], [900, 760], [100, 760]], target_box_xyxy: [350, 405, 665, 680]}
  cell_wash_area: {support_polygon: [[80, 520], [930, 500], [1010, 940], [20, 940]], target_box_xyxy: [365, 555, 680, 825]}
  communal_day_room: {support_polygon: [[240, 470], [850, 430], [980, 900], [90, 940]], target_box_xyxy: [400, 505, 715, 790]}
  property_inspection_station: {support_polygon: [[130, 440], [894, 440], [1010, 1010], [14, 1010]], target_box_xyxy: [345, 520, 679, 830]}
  correctional_workshop: {support_polygon: [[70, 460], [950, 460], [980, 880], [40, 880]], target_box_xyxy: [365, 510, 680, 790]}
  maintenance_service_area: {support_polygon: [[160, 390], [880, 420], [940, 850], [90, 820]], target_box_xyxy: [360, 460, 675, 750]}

control_layout:
  canvas_value: 32
  support_value: 128
  target_value: 235
  semantic_edge_value: 32
  pre_canny_blur_sigma: 1.0
  canny_thresholds: [80, 160]
  support_jitter_px: 28
  target_center_jitter_px: [70, 45]
  target_scale_factor: [0.72, 0.96]

prompt:
  prefix: A realistic handheld inspection photograph inside a correctional facility.
  suffix: >-
    {target} rests naturally on a horizontal support surface near the image
    center, fully visible and large enough for a reliable bounding box. Natural
    perspective, documentary photography, no people, no readable text.
  negative: >-
    wrong primary object, duplicate target, deformed target, floating object,
    cropped target, hidden target, hand, person, readable text, logo, watermark,
    illustration, cartoon, CGI

aerosol_full_scene:
  prompt_variants:
    - >-
      Documentary inspection photograph inside {scene}. One upright retail
      spray-paint aerosol can rests naturally on the central horizontal
      surface. Tall cylindrical metal body, colorful wrapper, plastic cap and
      push-button nozzle, fully visible. Institutional interior, no people.
    - >-
      Realistic correctional-facility inspection photo inside {scene}. One
      upright deodorant body-spray aerosol can stands on the central surface.
      Aluminum cylinder, colored graphics, rounded top, cap and spray actuator,
      fully visible, no people.
  negative_prompt: >-
    absent spray can, beverage can, drinking can, plumbing, pipe, faucet,
    fixture, ventilation fan, thermos, duplicate object, two cans, malformed
    cylinder, missing top, floating object, cropped object, person, hand,
    readable words, watermark, illustration, cartoon, CGI

release_gate:
  acceptance_test_approved: true
  production_approved: false
  success_rule: every_class_at_least_3_of_4_and_overall_at_least_56_of_64
