    thickness_ratio: 0.018
    rectangles: [[[0.16, 0.20], [0.84, 0.78]]]
    lines: [[[0.28, 0.32], [0.72, 0.32]], [[0.28, 0.45], [0.72, 0.45]], [[0.28, 0.58], [0.72, 0.58]]]
  5:
