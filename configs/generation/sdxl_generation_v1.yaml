format_version: 1
pipeline_id: sdxl_generation_v1
status: ready_for_acceptance_test
models_config: configs/generation/genai_models_v1.yaml
scene_policy: configs/generation/genai_scene_policy_v1.yaml
output_root: data/synthetic/sdxl_generation_v1/acceptance_test
seed: 53000
output_size: [1024, 1024]
inference_steps: 30
guidance_scale: 5.5
expected_images: 64
images_per_class_scene: 1
training_use_forbidden: true

# All outputs are generated as complete images in one diffusion pass.  No
# source RGB, background compositing, inpainting, or post-generation pasting.
generation_modes:
  default: silhouette_canny
  class_overrides:
    11: text_only_full_scene

controlnet_conditioning_scale:
  default: 0.80
  class_overrides: {1: 1.00, 3: 1.10, 5: 1.00, 11: 0.0, 12: 1.10, 14: 1.00, 15: 1.10}

silhouette_source:
  audit_manifest: data/processed/object_bank_sam3/asset_audit_manifest.csv
  selection_seed_offset: 1000
  preferred_stems:
    1: [IMG_20240805_095627086_obj_00_crop_000003, IMG_20240805_095706515_obj_00_crop_000007, IMG_20240805_105106202_obj_00_crop_000055, IMG_8365_obj_00_crop_000087]
    3: [IMG_20240805_114220959_obj_05_crop_000013, IMG_20240805_114253415_obj_02_crop_000022, IMG_20240805_134738569_obj_00_crop_000058, PHOTO-2023-11-09-15-42-59_205_obj_00_crop_000164]
    5: [IMG_0589new_obj_00_crop_000011, IMG_0638new_obj_00_crop_000026, IMG_0375new_obj_00_crop_000045, IMG_0432new_obj_01_crop_000057]
    8: [PHOTO-2023-11-08-13-46-44_obj_00_crop_000100, IMG_20240806_105616745_obj_00_crop_000036, IMG_20240806_110509079_obj_00_crop_000062, IMG_20240806_110929043_obj_00_crop_000076]
    12: [IMG_0575new_obj_03_crop_000006, IMG_0594new_obj_03_crop_000008]
    14: [IMG_0610new_obj_02_crop_000007, IMG_0304new_obj_01_crop_000021, IMG_0444new_obj_04_crop_000038, IMG_0494new_obj_00_crop_000044]
    15: [IMG_0004_obj_00_crop_000001, IMG_0005_obj_00_crop_000002, IMG_0006_obj_03_crop_000003, IMG_0011_obj_00_crop_000004]

class_rotation_degrees: {1: [0], 3: [0], 5: [0], 12: [0], 14: [0], 15: [0]}
class_target_phrases:
  0: [one disposable pocket lighter with a visible ignition wheel and metal top]
  1: [one open cardboard matchbox containing wooden safety matches with visible match heads]
  2: [one pair of household scissors with two finger handles and two metal blades]
  3: [one pair of red-handled combination pliers with two handles gripping jaws and a pivot]
  4: [one handheld knife with a single metal blade and handle]
  5: [one disposable T-shaped manual razor with a broad razor head and short handle]
  6: [one claw hammer with a metal head and wooden handle]
  7: [one cigarette pack with tobacco cigarettes visible]
  8: [one handheld hacksaw with a rigid frame handle and toothed blade]
  9: [one manual screwdriver with a handle and long metal shaft]
  10: [one metal wrench with a clearly visible jaw or ring end]
  12: [one rectangular 9-volt battery with two snap terminals on top]
  13: [one small bottle of alcoholic drink]
  14: [one modern rectangular smartphone with a glass screen bezel and camera]
  15: [one open laptop with one hinged screen keyboard and trackpad]

class_negative_additions:
  1: [single wooden stick, pencil, cigarette, razor]
  3: [scissors, forceps, hemostat, knife, wrench]
  5: [hammer, mallet, screwdriver, electric shaver]
  12: [remote control, mobile phone, flashlight, power bank, cylindrical battery]
  14: [remote control, calculator, battery, power bank]
  15: [desktop monitor, tablet, mobile phone, book, multiple computers]

