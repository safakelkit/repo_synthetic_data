format_version: 9
base_config: configs/generation/sdxl_generation_v8_aerosol_internal_edges_final_pilot.yaml
pipeline_id: sdxl_generation_v9_canonical
status: ready_for_acceptance_test
output_root: data/synthetic/sdxl_generation_v9/canonical

# Preserve the successful v3 all-class prompt policy.  Class 11 alone uses the
# validated internal-edge Canny branch inherited from the final aerosol pilot.
scene_prompt_profile_max_words: 22
prompt:
  target_first_template: "{target}"
  prefix: "Documentary evidence photo."
  suffix: >-
    Centered, fully visible, useful detection scale, no people or readable text.
  negative: >-
    wrong object, duplicate target, deformed target, floating object, cropped
    target, hidden target, hand, person, readable text, logo, watermark,
    illustration, cartoon, CGI

# Keep the aerosol identity first, then add a short organic setting.  The
# resulting positive and negative prompts are checked against SDXL's 77-token
# text-encoder limit before canonical generation.
class_prompt_templates:
  11: "{target}. {scene}."
class_negative_additions:
  11:
    - wall light
    - flashlight
    - pipe
    - thermos
    - bottle
    - pump sprayer
    - industrial machine
    - electrical device
    - spray cloud
    - multiple cans

release_gate:
  acceptance_test_approved: true
  production_approved: true
