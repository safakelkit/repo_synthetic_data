  5: {class_name: Shaver, mode: lying, allowed_supports: [bed_top, dining_table_top]}
  6: {class_name: Hammer, mode: lying, allowed_supports: [bed_top, dining_table_top, floor]}
  7: {class_name: Cigarettes, mode: lying, allowed_supports: [bed_top, dining_table_top, floor]}
  8: {class_name: Saw, mode: lying, allowed_supports: [bed_top, dining_table_top, floor]}
  9: {class_name: Screwdriver, mode: lying, allowed_supports: [bed_top, dining_table_top, floor]}
  10: {class_name: Wrench, mode: lying, allowed_supports: [bed_top, dining_table_top, floor]}
