  15: {class_name: Laptop, mode: asset_preserved_bottom_contact, allowed_supports: [bed_top, dining_table_top, floor]}

geometry_rules:
  lying: transformed_visible_bbox_must_fit_inside_support_region
  upright: bottom_alpha_contact_must_lie_inside_support_region
  asset_preserved_bottom_contact: preserve_asset_orientation_and_align_bottom_alpha_contact
  rotation: disabled_in_v1

limitations:
  - 2d_support_constraints_do_not_recover_scene_depth_or_perspective
  - lying_mode_preserves_source_crop_orientation_without_3d_pose_synthesis
  - lighting_and_contact_shadows_are_not_inferred
